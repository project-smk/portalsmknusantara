<html lang="id">
<head>
<meta charset="UTF-8">

<link rel="shortcut icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj16gfBS0ZizG1kOVDx3eLqEUyF2hXlDauK_5L3FmVcOFpVndctVpXcXtKP-QPMRBYCjvai1C7xFc5lZqHn8wgvh_9QtAPzm2meXazokEYnDcyTHl5Mp6J4OC9O4HIPP53otAZyOXPcUJJcdKo4WF-EhCljBhIJ3n-_5Wlesy2sdngL1PCmMuZmLTXUdPRI/s320/icon-512.png">
<link rel="apple-touch-icon" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj16gfBS0ZizG1kOVDx3eLqEUyF2hXlDauK_5L3FmVcOFpVndctVpXcXtKP-QPMRBYCjvai1C7xFc5lZqHn8wgvh_9QtAPzm2meXazokEYnDcyTHl5Mp6J4OC9O4HIPP53otAZyOXPcUJJcdKo4WF-EhCljBhIJ3n-_5Wlesy2sdngL1PCmMuZmLTXUdPRI/s320/icon-512.png">

<title>Portal SMK Swasta Nusantara Lubuk Pakam</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080D; --surface:#0A1119; --solid:#0A1119; --ink:#E6F1FA; --muted:#8CA0B3; --line:rgba(120,200,255,.16); --navy:#05080D; --navy2:rgba(120,200,255,.08);
  --exam:#2F6FED; --presensi:#0E9F8B; --ekskul:#EE8A1E; --accent:#22D3EE; --side-w:268px; --bar:62px;
  --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{--app-h:100%}
@supports (height:100dvh){html{--app-h:100dvh}}
body{height:var(--app-h);background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Gaya panel kontrol (HUD): garis tipis neon, sudut tegas, detail monospace */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);height:100%;background:var(--bg)}
.side{display:flex;flex-direction:column;padding:18px 14px;gap:22px;min-height:0;overflow:auto;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:8px;text-align:left;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--navy2);color:#fff}
.brand-mark{flex:none;width:46px;height:46px;border-radius:8px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 1px var(--accent),0 0 18px rgba(34,211,238,.35)}
.brand-mark img{width:100%;height:100%;display:block;object-fit:contain;padding:3px}
.brand b{display:block;font-size:14px;font-weight:800;line-height:1.2}
.brand span{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:6px}
.nav::before{content:"// APLIKASI";font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);padding:0 8px 6px}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;padding:9px;border-radius:8px;text-align:left;width:100%;border:1px solid transparent;transition:background .15s,border-color .15s}
@media (hover:hover){.nav-item:hover{background:var(--navy2);border-color:var(--line)}}
.nav-item[aria-current="page"]{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 24%,transparent),transparent);border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:inset 3px 0 0 var(--c)}
.ico{flex:none;width:42px;height:42px;border-radius:8px;background:var(--c);display:grid;place-items:center;color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent)}
.ico svg{width:24px;height:24px}
.ico:has(img){background:#fff;overflow:hidden}
.ico img{width:100%;height:100%;display:block;object-fit:contain;padding:3px}
.nav-text b{display:block;font-size:14px;font-weight:700}
.nav-text span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.03em}
.side-foot{margin-top:auto;font-size:12px;line-height:1.6;color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:8px}
.side-foot::before{content:"● ONLINE";display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:#34D399;margin-bottom:6px}

/* Panel utama */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:12px 20px;min-height:var(--bar);background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1::before{content:"> ";color:var(--accent)}
.tbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;background:var(--navy2);text-decoration:none;color:inherit;transition:border-color .15s,color .15s,box-shadow .15s}
@media (hover:hover){.tbtn:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px rgba(34,211,238,.25)}}
.tbtn svg{width:17px;height:17px}
.tbtn[hidden]{display:none}
.stage{position:relative;flex:1;min-height:0}

/* Beranda */
.home{position:absolute;inset:0;overflow:auto;padding:clamp(18px,3.6vw,44px);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;background-position:-1px -1px}
.home[hidden]{display:none}
.hello{max-width:1100px;margin-bottom:30px}
.hello::before{content:"// PORTAL.SEKOLAH";display:block;font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--accent);margin-bottom:12px}
.hello h2{font-size:clamp(26px,4.4vw,50px);font-weight:800;line-height:1.08;letter-spacing:-.03em}
.hello h2::after{content:"_";color:var(--accent);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hello p{margin-top:12px;color:var(--muted);font-size:clamp(14px,1.5vw,16px);line-height:1.65;max-width:56ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;max-width:1100px}
.card{position:relative;display:flex;flex-direction:column;gap:14px;min-height:240px;text-align:left;padding:24px;border-radius:6px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 12%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));transition:transform .18s,box-shadow .18s,border-color .18s}
.card::before,.card::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--c);pointer-events:none}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.card::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
@media (hover:hover){.card:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 14px 38px color-mix(in srgb,var(--c) 35%,transparent)}}
.card:active{transform:scale(.985)}
.card .ico{width:66px;height:66px;border-radius:10px}
.card .ico svg{width:36px;height:36px}
.card b{font-size:20px;font-weight:800}
.card p{font-size:14px;color:var(--muted);line-height:1.55}
.card .go{margin-top:auto;align-self:flex-start;padding:8px 14px;border:1px solid var(--c);border-radius:4px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c);transition:background .15s,color .15s}
.card .go::before{content:"▶ "}
@media (hover:hover){.card:hover .go{background:var(--c);color:#fff}}

/* Frames */
.frame{position:absolute;inset:0;background:var(--surface)}
.frame[hidden]{display:none}
.frame iframe{width:100%;height:100%;border:0;display:block}
.loader{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 14%,var(--surface)),var(--surface) 65%);transition:opacity .4s}
.loader.done{opacity:0;pointer-events:none}
.l-ico{width:92px;height:92px;border-radius:26px;animation:pulse 1.8s ease-in-out infinite;box-shadow:0 12px 32px color-mix(in srgb,var(--c) 40%,transparent)}
.l-ico svg{width:50px;height:50px}
.l-title{font-size:21px;font-weight:800}
.l-bar{width:min(300px,80vw);height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.l-fill{width:0;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));transition:width .25s ease-out}
.l-pct{font-size:13px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums}
.l-txt{font-size:13px;color:var(--muted);min-height:1.4em;max-width:34ch}
.l-txt a{color:var(--c);font-weight:700}
@keyframes pulse{50%{transform:scale(1.06);opacity:.9}}

/* Mode layar penuh: aplikasi memenuhi layar, menu lewat tombol melayang */
.app.full{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);background:var(--bg)}
.app.full .side,.app.full .top{display:none}
.app.full .main{border-radius:0}
body.full{background:var(--bg)}
.app.full{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.fab{position:fixed;z-index:50;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));touch-action:none}
.fab[hidden]{display:none}
.fab-btn{width:48px;height:48px;border-radius:50%;background:#05080D;color:#22D3EE;display:grid;place-items:center;box-shadow:0 0 18px rgba(34,211,238,.45);opacity:.9;transition:opacity .15s,transform .15s;border:1.5px solid #22D3EE}
.fab-btn:hover,.fab-btn[aria-expanded="true"]{opacity:1}
.fab-btn:active{transform:scale(.94)}
.fab-btn svg{width:22px;height:22px}
.fab-panel{position:absolute;bottom:58px;right:0;width:236px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 16px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:2px}
.fab-panel[hidden]{display:none}
.fab.left .fab-panel{right:auto;left:0}
.fab-panel button,.fab-panel a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:14px;font-weight:600;text-align:left;text-decoration:none;color:inherit;width:100%}
.fab-panel button:hover,.fab-panel a:hover{background:var(--navy2)}
.fab-panel .cur{background:var(--navy2);box-shadow:inset 3px 0 0 var(--c)}
.fab-panel .ico{width:30px;height:30px;border-radius:7px;box-shadow:none}
.fab-panel .ico svg{width:18px;height:18px}
.fab-panel .mini{width:30px;height:30px;display:grid;place-items:center;color:var(--muted)}
.fab-panel .mini svg{width:20px;height:20px}
.fab-panel hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* Layar sangat lebar */
@media (min-width:1440px){:root{--side-w:304px}.cards,.hello{max-width:1280px}.cards{gap:26px}}

/* Tablet: sidebar menjadi rel ikon */
@media (max-width:1024px){
  :root{--side-w:84px}
  .brand div:last-child,.nav-text,.side-foot,.nav::before{display:none}
  .side{align-items:center;padding:14px 10px}
  .brand,.nav-item{justify-content:center;padding:8px;width:auto}
  .brand{padding:6px}
  .nav-item[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--c)}
  .cards{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
}

/* HP: bilah menu di bawah */
@media (max-width:640px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .main{order:1}
  .side{order:2;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:0;overflow:visible;border-right:0;border-top:1px solid var(--line)}
  .brand{display:none}
  .nav{flex-direction:row;width:100%;gap:4px}
  .nav-item{flex-direction:column;gap:3px;padding:6px 4px;flex:1;justify-content:center}
  .nav-item[aria-current="page"]{box-shadow:inset 0 3px 0 var(--c);background:linear-gradient(0deg,color-mix(in srgb,var(--c) 22%,transparent),transparent)}
  .nav-text{display:block;text-align:center}
  .nav-text span{display:none}
  .nav-text b{font-size:11px;font-weight:600}
  .ico{width:36px;height:36px}
  .ico svg{width:21px;height:21px}
  .top{padding:10px 12px;min-height:52px}
  .top h1{font-size:12px}
  .tbtn span{display:none}
  .tbtn{padding:8px}
  .home{padding:18px 14px;background-size:34px 34px}
  .hello{margin-bottom:18px}
  .cards{grid-template-columns:1fr;gap:12px}
  .card{flex-direction:row;align-items:center;gap:14px;min-height:0;padding:14px 16px}
  .card .ico{width:52px;height:52px}
  .card p,.card .go{display:none}
  .card b{font-size:16px}
}
/* Layar landscape pendek (HP diputar) */
@media (max-height:480px) and (orientation:landscape){
  :root{--bar:44px}
  .top{padding:6px 14px}
  .hello::before,.hello p{display:none}
  .hello h2{font-size:22px}
  .hello{margin-bottom:12px}
  .home{padding:12px 16px}
}
/* Smart Presensi: iframe digeser 3px ke atas untuk menyembunyikan banner Google */
.frame.shift{overflow:hidden;--shift:3px}
.frame.shift iframe{position:absolute;top:calc(var(--shift) * -1);left:0;height:calc(100% + var(--shift))}

/* Jembatan kamera Smart Presensi (scan barcode & selfie langsung dari kamera) */
#scanOverlay,#selfieOverlay{position:fixed;inset:0;z-index:10000;display:none;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:14px;padding:16px;overflow:auto;background:rgba(15,23,42,.92)}
#scanOverlay.show,#selfieOverlay.show{display:flex}
#scanOverlay video{width:min(92vw,420px,56vh);width:min(92vw,420px,56dvh);aspect-ratio:1/1;object-fit:cover;border-radius:14px;background:#000}
#selfieOverlay video{width:min(92vw,420px);aspect-ratio:3/4;max-height:70vh;max-height:70dvh;object-fit:cover;border-radius:14px;background:#000}
#scanOverlay p,#selfieOverlay p{color:#fff;font-size:14px;font-weight:600;text-align:center}
@media (max-height:520px){#selfieOverlay video{max-height:50dvh}}
#selfieOverlay .row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
#scanOverlay button,#selfieOverlay button{padding:12px 26px;border-radius:10px;font-size:14px;font-weight:700;background:#fff;color:#0f172a}
#selfieOverlay #selfieFlip{display:none;background:#e2e8f0}
#selfieOverlay.canflip #selfieFlip{display:inline-block}
#selfieOverlay #selfieShot{background:#059669;color:#fff}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <button class="brand" id="brandBtn" aria-label="Kembali ke beranda portal">
      <div class="brand-mark" aria-hidden="true"><img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiiqlE-zYGrIu6DveVhY3WdPQFZRtdWBx35gGyI88TQnLzTX5SbI78EVTFbPbTHfvc4BVs79cnjvFariowndXyiK3zPBtNUKL1k3sgJW_xbYRWFscNdoQTprJf6yF6CgKoXERgRyzZiOEXHcHO-bcKmXpHjFVbDTJyPOXzOXgo3555vYH6hA_eNuwUVUSUC/w128-h128-p-k-no-nu/Logo%20SMK%20Nusantara%20Lubuk%20Pakam.png" alt="Logo SMK Nusantara" width="44" height="44"></div>
      <div><b>SMK Swasta Nusantara</b><span>Lubuk Pakam</span></div>
    </button>
    <nav class="nav" id="nav" aria-label="Aplikasi sekolah"></nav>
    <p class="side-foot">Portal aplikasi sekolah. Pilih aplikasi di atas untuk membukanya di halaman ini.</p>
  </aside>

  <section class="main">
    <header class="top">
      <h1 id="title">Beranda Portal</h1>
      <button class="tbtn" id="reload" hidden title="Muat ulang aplikasi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>Muat ulang</span>
      </button>
      <a class="tbtn" id="ext" hidden target="_blank" rel="noopener" title="Buka di tab baru">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>Tab baru</span>
      </a>
    </header>
    <div class="stage" id="stage">
      <div class="home" id="home">
        <div class="hello">
          <h2>Pilih aplikasi yang ingin dibuka</h2>
          <p>Presensi, Ujian dan Kegiatan Ekstrakurikuler dapat diakses dalam satu portal.</p>
        </div>
        <div class="cards" id="cards"></div>
      </div>
    </div>
  </section>
</div>

<!-- Layar scan kamera untuk barcode presensi -->
<div id="scanOverlay" role="dialog" aria-live="polite">
  <p>Arahkan kamera ke barcode</p>
  <video id="scanVideo" playsinline muted></video>
  <button id="scanCancel" type="button">Batal</button>
</div>

<!-- Layar selfie: hanya kamera langsung (tanpa pilihan galeri) -->
<div id="selfieOverlay" role="dialog" aria-live="polite">
  <p id="selfieHint">Posisikan wajah di dalam bingkai</p>
  <video id="selfieVideo" playsinline muted></video>
  <div class="row">
    <button id="selfieShot" type="button">Ambil Foto</button>
    <button id="selfieFlip" type="button">Balik Kamera</button>
    <button id="selfieCancel" type="button">Batal</button>
  </div>
</div>

<div class="fab" id="fab" hidden>
  <div class="fab-panel" id="fabPanel" hidden></div>
  <button class="fab-btn" id="fabBtn" aria-label="Menu portal" aria-expanded="false" aria-controls="fabPanel">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
  </button>
</div>
<script>
// Tinggi aplikasi = area layar yang benar-benar terlihat (bar alamat/toolbar/keyboard HP naik-turun)
(function(){
  const root = document.documentElement; let raf = 0;
  function fit(){
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const vv = window.visualViewport; let h = window.innerHeight;
      if(vv && vv.scale <= 1.01) h = Math.min(h, vv.height + vv.offsetTop);
      root.style.setProperty('--app-h', Math.round(h) + 'px');
    });
  }
  ['resize','orientationchange','pageshow'].forEach(ev => addEventListener(ev, fit));
  document.addEventListener('fullscreenchange', fit);
  if(window.visualViewport) visualViewport.addEventListener('resize', fit);
  fit(); setTimeout(fit, 300); setTimeout(fit, 1200);
})();

function makeFrame(a){
  const wrap = document.createElement('div');
  wrap.className = 'frame' + (a.src ? ' shift' : ''); wrap.hidden = true; wrap.style.setProperty('--c', a.color);
  wrap.innerHTML = `<div class="loader"><span class="ico l-ico">${icoImg(a)}</span><b class="l-title">${a.name}</b><div class="l-bar"><div class="l-fill"></div></div><span class="l-pct">0%</span><p class="l-txt">Menyiapkan aplikasi…</p></div>`;
  const f = document.createElement('iframe');
  f.title = a.name; f.allow = ALLOW; f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
  f.setAttribute('allowfullscreen','');
  const loader = wrap.querySelector('.loader'), fill = wrap.querySelector('.l-fill'), pct = wrap.querySelector('.l-pct'), txt = wrap.querySelector('.l-txt');
  let progress = 0, done = false, slow = false, timer = 0, tSlow = 0, tGive = 0;
  // Progres hanya perkiraan (iframe tidak melaporkan progres asli): cepat di awal, melambat mendekati 90%
  function render(){
    const p = Math.floor(progress);
    fill.style.width = p + '%'; pct.textContent = p + '%';
    if(slow && !done) return;
    txt.textContent = p < 30 ? 'Menyiapkan aplikasi…' : p < 70 ? 'Menghubungkan ke server…' : p < 100 ? 'Memuat data…' : 'Selesai!';
  }
  function finish(){
    if(done) return; done = true;
    clearInterval(timer); clearTimeout(tSlow); clearTimeout(tGive);
    progress = 100; render();
    setTimeout(() => loader.classList.add('done'), 350);
  }
  function start(){
    done = false; slow = false; progress = 0; render(); loader.classList.remove('done');
    clearInterval(timer); clearTimeout(tSlow); clearTimeout(tGive);
    timer = setInterval(() => { if(done) return; progress += (90 - progress) * 0.04 + 0.15; if(progress > 90) progress = 90; render(); }, 120);
    tSlow = setTimeout(() => { if(done) return; slow = true; txt.innerHTML = `Belum tampil? <a href="${a.url}" target="_blank" rel="noopener">Buka di tab baru</a>`; }, 20000);
    tGive = setTimeout(finish, 40000); // pengaman: tutup layar loading bila load tidak terpicu
  }
  f.addEventListener('load', finish);
  start(); f.src = a.src || a.url;
  wrap.appendChild(f);
  $('stage').appendChild(wrap);
  frames[a.id] = {wrap, f, loader, restart(){ start(); f.src = a.src || a.url; }};
}

function openApp(id, fromHash){
  SPBridge.stop();
  const a = APPS.find(x => x.id === id); if(!a) return goHome();
  if(!frames[id]) makeFrame(a);
  Object.entries(frames).forEach(([k,v]) => v.wrap.hidden = (k !== id));
  $('home').hidden = true; current = id;
  setFull(true); buildPanel();
  $('title').textContent = a.name;
  $('ext').href = a.url; $('ext').hidden = false; $('reload').hidden = false;
  document.querySelectorAll('.nav-item').forEach(n => n.dataset.id === id ? n.setAttribute('aria-current','page') : n.removeAttribute('aria-current'));
  document.title = a.name + ' · Portal SMK Nusantara';
  if(!fromHash && location.hash !== '#' + id) history.pushState(null,'','#' + id);
}
function goHome(fromHash){
  SPBridge.stop();
  Object.values(frames).forEach(v => v.wrap.hidden = true);
  $('home').hidden = false; current = null;
  setFull(false); closePanel();
  $('title').textContent = 'Beranda Portal';
  $('ext').hidden = true; $('reload').hidden = true;
  document.querySelectorAll('.nav-item').forEach(n => n.removeAttribute('aria-current'));
  document.title = 'Portal SMK Swasta Nusantara Lubuk Pakam';
  if(!fromHash && location.hash) history.pushState(null,'',location.pathname + location.search);
}

// Wake lock: layar tetap menyala selama aplikasi terbuka
let wl = null, wlWanted = true;
async function lockOn(){
  try{
    if('wakeLock' in navigator && !wl && document.visibilityState === 'visible'){
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; });
    }
  }catch(e){}
}
function lockOff(){ try{ if(wl){ wl.release(); } }catch(e){} wl = null; }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && current && wlWanted) lockOn(); });

// Mode layar penuh + tombol melayang

  $('app').classList.toggle('full', on);
  document.body.classList.toggle('full', on);
  $('fab').hidden = !on;
  if(on && wlWanted) lockOn(); else lockOff();
}

// Tombol bisa digeser agar tidak menutupi bagian aplikasi
(function(){
  const fab = $('fab'), btn = $('fabBtn');
  let drag = null, moved = false;
  btn.addEventListener('pointerdown', e => {
    const r = fab.getBoundingClientRect();
    drag = {dx:e.clientX - r.left, dy:e.clientY - r.top, x:e.clientX, y:e.clientY}; moved = false;
    btn.setPointerCapture(e.pointerId);
  });
  btn.addEventListener('pointermove', e => {
    if(!drag) return;
    if(!moved && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 6) return;
    moved = true; closePanel();
    const x = Math.min(Math.max(0, e.clientX - drag.dx), innerWidth - 46);
    const y = Math.min(Math.max(0, e.clientY - drag.dy), innerHeight - 46);
    fab.style.left = x + 'px'; fab.style.top = y + 'px'; fab.style.right = 'auto'; fab.style.bottom = 'auto';
  });
  btn.addEventListener('pointerup', () => { drag = null; });
  btn.addEventListener('click', () => {
    if(moved){ moved = false; return; }
    const open = $('fabPanel').hidden;
    if(open){
      buildPanel();
      const r = fab.getBoundingClientRect();
      const pv = $('fabPanel'), up = r.top > innerHeight/2;
      const pw = Math.min(230, innerWidth - 16);
      const L = Math.min(Math.max(8, r.left < innerWidth/2 ? r.left : r.right - pw), innerWidth - pw - 8);
      pv.style.width = pw + 'px'; pv.style.right = 'auto'; pv.style.left = (L - r.left) + 'px';
      pv.style.bottom = up ? '56px' : 'auto'; pv.style.top = up ? 'auto' : '56px';
      pv.style.maxHeight = Math.max(140, (up ? r.top : innerHeight - r.bottom) - 20) + 'px';
      pv.style.overflowY = 'auto';
    }
    $('fabPanel').hidden = !open; btn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closePanel(); });
  function clampFab(){
    if(!fab.style.left) return;
    fab.style.left = Math.min(Math.max(0, parseFloat(fab.style.left)), Math.max(0, innerWidth - 46)) + 'px';
    fab.style.top = Math.min(Math.max(0, parseFloat(fab.style.top)), Math.max(0, innerHeight - 46)) + 'px';
    closePanel();
  }
  addEventListener('resize', clampFab); addEventListener('orientationchange', clampFab);
})();

// Jembatan kamera Smart Presensi
// Apps Script memblokir kamera di dalam aplikasinya, jadi aplikasi meminta halaman induk (portal ini)
// membuka kamera lalu mengirim hasilnya lewat postMessage. Protokolnya sama dengan halaman pembungkus lama.
const SPBridge = (function(){
  const okOrigin = o => /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(o);
  const scanOv = $('scanOverlay'), scanVid = $('scanVideo'), selOv = $('selfieOverlay'), selVid = $('selfieVideo');
  const scan = {stream:null, timer:0, busy:false, target:null, origin:'', detector:null};
  const sel = {stream:null, target:null, origin:'', rear:false, canFlip:false};

  function send(t, type, extra){
    if(!t.target) return;
    try{ t.target.postMessage(Object.assign({type}, extra || {}), t.origin); }catch(e){}
  }
  function errMsg(e, rear, selfie){
    const n = (e && e.name) || '';
    if(n === 'NotAllowedError' || n === 'SecurityError') return 'Izin kamera ditolak/diblokir. Izinkan kamera untuk situs ini (ikon gembok di bilah alamat), lalu coba lagi.';
    if(n === 'NotFoundError' || n === 'OverconstrainedError') return selfie ? (rear ? 'Kamera belakang tidak ditemukan di perangkat ini.' : 'Kamera depan tidak ditemukan di perangkat ini.') : 'Kamera tidak ditemukan di perangkat ini. Gunakan browser lain.';
    if(n === 'NotReadableError') return 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera lalu coba lagi.';
    return 'Kamera tidak bisa dibuka' + (n ? ' (' + n + ')' : '') + '.';
  }
  function getCam(facing){
    return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}}, audio:false})
      .catch(e => (e && (e.name === 'OverconstrainedError' || e.name === 'NotFoundError'))
        ? navigator.mediaDevices.getUserMedia({video:true, audio:false}) : Promise.reject(e));
  }
  const hasCam = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

  // ----- Scan barcode -----
  function scanStop(){
    clearTimeout(scan.timer); scan.busy = false;
    if(scan.stream){ scan.stream.getTracks().forEach(t => t.stop()); scan.stream = null; }
    scanVid.srcObject = null; scanOv.classList.remove('show');
  }
  function decode(c, ctx, w, h){
    const viaJsQR = () => {
      if(typeof jsQR === 'undefined') return Promise.resolve(null);
      const r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts:'attemptBoth'});
      return Promise.resolve(r ? r.data : null);
    };
    if('BarcodeDetector' in window){
      try{
        scan.detector = scan.detector || new BarcodeDetector({formats:['qr_code']});
        return scan.detector.detect(c).then(r => (r && r.length) ? r[0].rawValue : viaJsQR(), viaJsQR);
      }catch(e){}
    }
    return viaJsQR();
  }
  function scanStart(src, origin){
    if(scan.stream) return;
    scan.target = src; scan.origin = origin;
    if(!hasCam()){ send(scan, 'SP_SCAN_ERROR', {message:'Browser tidak mendukung kamera langsung. Gunakan browser lain.'}); return; }
    getCam('environment').then(s => {
      scan.stream = s; scanVid.muted = true; scanVid.srcObject = s;
      scanOv.classList.add('show');
      const p = scanVid.play(); if(p && p.catch) p.catch(() => {});
      const c = document.createElement('canvas'), ctx = c.getContext('2d', {willReadFrequently:true});
      (function loop(){
        if(!scan.stream) return;
        if(scanVid.videoWidth && !scan.busy){
          scan.busy = true;
          const k = Math.min(1, 960 / scanVid.videoWidth), w = Math.round(scanVid.videoWidth * k), h = Math.round(scanVid.videoHeight * k);
          c.width = w; c.height = h; ctx.drawImage(scanVid, 0, 0, w, h);
          decode(c, ctx, w, h).then(text => {
            scan.busy = false;
            if(text && scan.stream){ scanStop(); send(scan, 'SP_SCAN_RESULT', {text}); }
          }, () => { scan.busy = false; });
        }
        scan.timer = setTimeout(loop, 150);
      })();
    }).catch(e => send(scan, 'SP_SCAN_ERROR', {message:errMsg(e)}));
  }
  $('scanCancel').addEventListener('click', () => { scanStop(); send(scan, 'SP_SCAN_CANCEL'); });

  // ----- Selfie / foto bukti -----
  function selHint(){
    if(!sel.canFlip) return 'Posisikan wajah di dalam bingkai';
    return sel.rear ? 'Arahkan kamera belakang ke bukti/kondisi Anda' : 'Kamera depan aktif. Tekan Balik Kamera untuk kamera belakang';
  }
  function selStop(){
    if(sel.stream){ sel.stream.getTracks().forEach(t => t.stop()); sel.stream = null; }
    selVid.srcObject = null; selOv.classList.remove('show');
  }
  function selOpen(){
    selOv.classList.toggle('rear', sel.rear);
    $('selfieHint').textContent = selHint();
    return getCam(sel.rear ? 'environment' : 'user').then(s => {
      sel.stream = s; selVid.muted = true; selVid.srcObject = s;
      selOv.classList.add('show');
      const p = selVid.play(); if(p && p.catch) p.catch(() => {});
    });
  }
  // facing 'environment' = foto bukti PKL/Izin/Sakit (mulai kamera belakang, boleh dibalik). Selain itu: selfie Hadir (kamera depan saja).
  function selStart(src, origin, facing){
    if(sel.stream) return;
    sel.target = src; sel.origin = origin;
    sel.canFlip = (facing === 'environment'); sel.rear = sel.canFlip;
    selOv.classList.toggle('canflip', sel.canFlip);
    if(!hasCam()){ send(sel, 'SP_SELFIE_ERROR', {message:'Browser tidak mendukung kamera langsung.'}); return; }
    selOpen().catch(e => send(sel, 'SP_SELFIE_ERROR', {message:errMsg(e, sel.rear, true)}));
  }
  $('selfieFlip').addEventListener('click', () => {
    if(!sel.stream || !sel.canFlip) return;
    sel.stream.getTracks().forEach(t => t.stop()); sel.stream = null; selVid.srcObject = null;
    sel.rear = !sel.rear;
    selOpen().catch(e => { selStop(); send(sel, 'SP_SELFIE_ERROR', {message:errMsg(e, sel.rear, true)}); });
  });
  $('selfieShot').addEventListener('click', () => {
    if(!sel.stream || !selVid.videoWidth) return;
    let w = selVid.videoWidth, h = selVid.videoHeight; const maxDim = sel.canFlip ? 900 : 400;
    if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
    else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(selVid, 0, 0, w, h);
    const dataUrl = c.toDataURL('image/jpeg', sel.canFlip ? 0.6 : 0.5);
    selStop(); send(sel, 'SP_SELFIE_RESULT', {dataUrl});
  });
  $('selfieCancel').addEventListener('click', () => { selStop(); send(sel, 'SP_SELFIE_CANCEL'); });

  // ----- Pesan dari Smart Presensi -----
  window.addEventListener('message', e => {
    if(current !== 'smartpresensi') return;
    if(!okOrigin(e.origin) || !e.data || typeof e.data !== 'object') return;
    const t = e.data.type;
    if(t === 'SP_SCAN_REQUEST'){
      try{ e.source.postMessage({type:'SP_SCAN_ACK'}, e.origin); }catch(x){}
      scanStart(e.source, e.origin);
    }else if(t === 'SP_SELFIE_REQUEST'){
      const facing = e.data.facing === 'environment' ? 'environment' : 'user';
      try{ e.source.postMessage({type:'SP_SELFIE_ACK', facing}, e.origin); }catch(x){}
      selStart(e.source, e.origin, e.data.facing);
    }else if(t === 'SP_FULLSCREEN_REQUEST'){
      const el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen;
      if(rq && !document.fullscreenElement){ try{ const p = rq.call(el); if(p && p.catch) p.catch(() => {}); }catch(x){} }
    }
  });
  return {stop(){ scanStop(); selStop(); }};
})();
