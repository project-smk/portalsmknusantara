<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12263A">
<title>Portal SMK Swasta Nusantara Lubuk Pakam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12263A; --navy2:#1C3550; --bg:#F3F6F8; --surface:#fff; --ink:#14212E; --muted:#5C6B7A; --line:#DDE4EA;
  --side-text:#C9D6E2; --side-active:#fff;
  --exam:#2F6FED; --presensi:#0E9F8B; --ekskul:#EE8A1E;
  --side-w:288px; --bar-h:64px;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0C141C; --surface:#152230; --ink:#E8EEF3; --muted:#93A3B3; --line:#243546}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #7FB0FF;outline-offset:2px}

.app{display:grid;grid-template-columns:var(--side-w) 1fr;height:100%}

/* Sidebar */
.side{background:var(--navy);color:var(--side-text);display:flex;flex-direction:column;padding:20px 14px;gap:22px;min-height:0}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px;text-align:left;color:#fff;width:100%}
.brand-mark{flex:none;width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center}
.brand-mark svg{width:28px;height:28px}
.brand b{display:block;font-size:15px;font-weight:800;line-height:1.2}
.brand span{font-size:12px;color:var(--side-text)}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;text-align:left;width:100%;transition:background .15s}
.nav-item:hover{background:var(--navy2)}
.nav-item[aria-current="page"]{background:var(--navy2);color:var(--side-active);box-shadow:inset 3px 0 0 var(--c)}
.ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--c);display:grid;place-items:center;color:#fff}
.ico svg{width:26px;height:26px}
.nav-text b{display:block;font-size:14px;font-weight:700}
.nav-text span{font-size:12px;opacity:.75}
.side-foot{margin-top:auto;font-size:12px;padding:0 8px;opacity:.7;line-height:1.5}

/* Main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);min-height:60px}
.top h1{font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--surface)}
.tbtn:hover{background:var(--bg)}
.tbtn svg{width:18px;height:18px}
.tbtn[hidden]{display:none}
.stage{position:relative;flex:1;min-height:0}

/* Home */
.home{position:absolute;inset:0;overflow:auto;padding:32px clamp(16px,4vw,48px)}
.home[hidden]{display:none}
.hello{max-width:760px;margin-bottom:28px}
.hello h2{font-size:clamp(24px,3.4vw,38px);font-weight:800;line-height:1.15;letter-spacing:-.02em}
.hello p{margin-top:10px;color:var(--muted);font-size:15px;line-height:1.6;max-width:56ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;max-width:1100px}
.card{display:flex;flex-direction:column;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;border-top:5px solid var(--c);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(18,38,58,.12)}
.card .ico{width:60px;height:60px;border-radius:16px}
.card .ico svg{width:34px;height:34px}
.card b{font-size:18px;font-weight:800}
.card p{font-size:14px;color:var(--muted);line-height:1.55}
.card .go{margin-top:auto;font-size:13px;font-weight:700;color:var(--c)}

/* Frames */
.frame{position:absolute;inset:0;background:var(--surface)}
.frame[hidden]{display:none}
.frame iframe{width:100%;height:100%;border:0;display:block}
.loader{position:absolute;inset:0;display:grid;place-content:center;gap:14px;justify-items:center;text-align:center;padding:24px;background:var(--surface);transition:opacity .25s}
.loader.done{opacity:0;pointer-events:none}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--c);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loader p{font-size:14px;color:var(--muted);max-width:32ch}
.loader a{color:var(--c);font-weight:700}


/* Mode layar penuh: aplikasi memenuhi layar, menu lewat tombol melayang */
.app.full{grid-template-columns:1fr;grid-template-rows:1fr}
.app.full .side,.app.full .top{display:none}
body.full{padding-top:0}
.fab{position:fixed;z-index:50;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));touch-action:none}
.fab[hidden]{display:none}
.fab-btn{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:.78;transition:opacity .15s;border:2px solid rgba(255,255,255,.85)}
.fab-btn:hover,.fab-btn[aria-expanded="true"]{opacity:1}
.fab-btn svg{width:22px;height:22px}
.fab-panel{position:absolute;bottom:56px;right:0;width:230px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:2px}
.fab-panel[hidden]{display:none}
.fab.left .fab-panel{right:auto;left:0}
.fab-panel button,.fab-panel a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:14px;font-weight:600;text-align:left;text-decoration:none;color:inherit;width:100%}
.fab-panel button:hover,.fab-panel a:hover{background:var(--bg)}
.fab-panel .cur{background:var(--bg);box-shadow:inset 3px 0 0 var(--c)}
.fab-panel .ico{width:30px;height:30px;border-radius:9px}
.fab-panel .ico svg{width:18px;height:18px}
.fab-panel .mini{width:30px;height:30px;display:grid;place-items:center;color:var(--muted)}
.fab-panel .mini svg{width:20px;height:20px}
.fab-panel hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* Tablet: sidebar menjadi rel ikon */
@media (max-width:1024px){
  :root{--side-w:84px}
  .brand div:last-child,.nav-text,.side-foot{display:none}
  .side{align-items:center;padding:16px 10px}
  .brand,.nav-item{justify-content:center;padding:8px;width:auto}
  .brand-mark{width:48px;height:48px}
  .nav-item[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--c)}
}

/* HP: menu pindah ke bawah */
@media (max-width:640px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{order:2;flex-direction:row;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));gap:0;justify-content:space-around;border-top:1px solid var(--navy2)}
  .brand{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around;gap:4px}
  .nav-item{flex-direction:column;gap:3px;padding:6px 4px;flex:1;max-width:120px;border-radius:12px}
  .nav-text{display:block;text-align:center}
  .nav-text span{display:none}
  .nav-text b{font-size:11px;font-weight:600}
  .ico{width:38px;height:38px;border-radius:11px}
  .ico svg{width:22px;height:22px}
  .nav-item[aria-current="page"]{box-shadow:none}
  .nav-item[aria-current="page"] .ico{outline:2px solid #fff;outline-offset:2px}
  .top{padding:10px 14px;min-height:54px}
  .top h1{font-size:15px}
  .tbtn span{display:none}
  .tbtn{padding:9px}
  .home{padding:22px 16px}
  .cards{grid-template-columns:1fr;gap:12px}
  .card{flex-direction:row;align-items:center;gap:14px;padding:16px;border-top:1px solid var(--line);border-left:5px solid var(--c)}
  .card .ico{width:52px;height:52px}
  .card p,.card .go{display:none}
  .card b{font-size:16px}
}
/* Layar landscape pendek (HP diputar) */
@media (max-height:480px) and (orientation:landscape){
  .top{min-height:46px;padding:6px 14px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <button class="brand" id="brandBtn" aria-label="Kembali ke beranda portal">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><path d="M16 3 3 10l13 7 13-7L16 3Z" fill="#12263A"/><path d="M8 15v6c0 2.5 3.6 5 8 5s8-2.5 8-5v-6l-8 4.3L8 15Z" fill="#0E9F8B"/><path d="M29 10v9" stroke="#EE8A1E" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div><b>SMK Swasta Nusantara</b><span>Lubuk Pakam</span></div>
    </button>
    <nav class="nav" id="nav" aria-label="Aplikasi sekolah"></nav>
    <p class="side-foot">Portal aplikasi sekolah. Pilih aplikasi di atas untuk membukanya di halaman ini.</p>
  </aside>

  <section class="main">
    <header class="top">
      <h1 id="title">Beranda Portal</h1>
      <button class="tbtn" id="reload" hidden title="Muat ulang aplikasi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>Muat ulang</span>
      </button>
      <a class="tbtn" id="ext" hidden target="_blank" rel="noopener" title="Buka di tab baru">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>Tab baru</span>
      </a>
    </header>
    <div class="stage" id="stage">
      <div class="home" id="home">
        <div class="hello">
          <h2>Pilih aplikasi yang ingin dibuka</h2>
          <p>Ujian, presensi, dan kegiatan ekstrakurikuler dapat diakses dari satu halaman ini.</p>
        </div>
        <div class="cards" id="cards"></div>
      </div>
    </div>
  </section>
</div>

<div class="fab" id="fab" hidden>
  <div class="fab-panel" id="fabPanel" hidden></div>
  <button class="fab-btn" id="fabBtn" aria-label="Menu portal" aria-expanded="false" aria-controls="fabPanel">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
  </button>
</div>
<script>
const ICONS = {
  exam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m8.5 12.5 2 2 4-4.5"/><path d="M9 18h6"/></svg>',
  presensi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="10" r="2.6"/><path d="M7.5 17c.6-2 2.4-3.2 4.5-3.2s3.9 1.2 4.5 3.2"/></svg>',
  ekskul:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M8 6H5v1.5A3 3 0 0 0 8 10.5M16 6h3v1.5a3 3 0 0 1-3 3"/><path d="M12 13v4M8.5 20h7M10 17h4"/></svg>'
};
// Izin fitur perangkat yang diteruskan ke semua aplikasi di dalam iframe
const ALLOW = ['camera','microphone','geolocation','screen-wake-lock','fullscreen','clipboard-read','clipboard-write','web-share','autoplay','accelerometer','gyroscope','magnetometer','picture-in-picture','display-capture','storage-access','encrypted-media','publickey-credentials-get'].map(x => x + ' *').join('; ');
const APPS = [
  {id:'smartpresensi', name:'Smart Presensi', short:'Presensi', desc:'Presensi siswa dengan selfie dan lokasi GPS, dipantau guru dan wali kelas.', url:'https://project-smk.github.io/smartpresensi/', icon:'presensi', color:'#0E9F8B', perm:'camera; fullscreen; geolocation'},
  {id:'examcbt', name:'Exam CBT', short:'Ujian', desc:'Ujian berbasis web untuk siswa, lengkap dengan panel admin.', url:'https://project-smk.github.io/examcbt/', icon:'exam', color:'#2F6FED', perm:'fullscreen'},
  {id:'ekskulgenius', name:'Ekskul Genius', short:'Ekskul', desc:'Kelola kegiatan, anggota, dan prestasi ekstrakurikuler.', url:'https://project-smk.github.io/ekskulgenius/', icon:'ekskul', color:'#EE8A1E', perm:'fullscreen'}
];
const $ = id => document.getElementById(id);
const frames = {};
let current = null;

// Menu & kartu
APPS.forEach(a => {
  const nav = document.createElement('button');
  nav.className = 'nav-item'; nav.style.setProperty('--c', a.color); nav.dataset.id = a.id;
  nav.innerHTML = `<span class="ico">${ICONS[a.icon]}</span><span class="nav-text"><b>${a.short === 'Ujian' ? 'Exam CBT' : a.name}</b><span>${a.short}</span></span>`;
  nav.onclick = () => openApp(a.id);
  $('nav').appendChild(nav);

  const card = document.createElement('button');
  card.className = 'card'; card.style.setProperty('--c', a.color);
  card.innerHTML = `<span class="ico">${ICONS[a.icon]}</span><div><b>${a.name}</b></div><p>${a.desc}</p><span class="go">Buka aplikasi</span>`;
  card.onclick = () => openApp(a.id);
  $('cards').appendChild(card);
});

function makeFrame(a){
  const wrap = document.createElement('div');
  wrap.className = 'frame'; wrap.hidden = true; wrap.style.setProperty('--c', a.color);
  wrap.innerHTML = `<div class="loader"><div class="spin"></div><p>Membuka ${a.name}…</p></div>`;
  const f = document.createElement('iframe');
  f.title = a.name; f.src = a.url; f.allow = ALLOW; f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
  f.setAttribute('allowfullscreen','');
  const loader = wrap.querySelector('.loader');
  const slow = setTimeout(() => {
    loader.querySelector('p').innerHTML = `Aplikasi belum tampil? <a href="${a.url}" target="_blank" rel="noopener">Buka di tab baru</a>`;
  }, 12000);
  f.onload = () => { clearTimeout(slow); loader.classList.add('done'); };
  wrap.appendChild(f);
  $('stage').appendChild(wrap);
  frames[a.id] = {wrap, f, loader};
}

function openApp(id, fromHash){
  const a = APPS.find(x => x.id === id); if(!a) return goHome();
  if(!frames[id]) makeFrame(a);
  Object.entries(frames).forEach(([k,v]) => v.wrap.hidden = (k !== id));
  $('home').hidden = true; current = id;
  setFull(true); buildPanel();
  $('title').textContent = a.name;
  $('ext').href = a.url; $('ext').hidden = false; $('reload').hidden = false;
  document.querySelectorAll('.nav-item').forEach(n => n.dataset.id === id ? n.setAttribute('aria-current','page') : n.removeAttribute('aria-current'));
  document.title = a.name + ' · Portal SMK Nusantara';
  if(!fromHash) history.replaceState(null,'','#' + id);
}
function goHome(fromHash){
  Object.values(frames).forEach(v => v.wrap.hidden = true);
  $('home').hidden = false; current = null;
  setFull(false); closePanel();
  $('title').textContent = 'Beranda Portal';
  $('ext').hidden = true; $('reload').hidden = true;
  document.querySelectorAll('.nav-item').forEach(n => n.removeAttribute('aria-current'));
  document.title = 'Portal SMK Swasta Nusantara Lubuk Pakam';
  if(!fromHash) history.replaceState(null,'',location.pathname + location.search);
}

// Wake lock: layar tetap menyala selama aplikasi terbuka
let wl = null, wlWanted = true;
async function lockOn(){
  try{
    if('wakeLock' in navigator && !wl && document.visibilityState === 'visible'){
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; });
    }
  }catch(e){}
}
function lockOff(){ try{ if(wl){ wl.release(); } }catch(e){} wl = null; }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && current && wlWanted) lockOn(); });

// Mode layar penuh + tombol melayang
function setFull(on){
  $('app').classList.toggle('full', on);
  document.body.classList.toggle('full', on);
  $('fab').hidden = !on;
  if(on && wlWanted) lockOn(); else lockOff();
}
function closePanel(){ $('fabPanel').hidden = true; $('fabBtn').setAttribute('aria-expanded','false'); }
function buildPanel(){
  const a0 = APPS.find(x => x.id === current);
  const p = $('fabPanel');
  p.innerHTML = '<button data-act="home"><span class="mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/></svg></span>Beranda portal</button><hr>'
    + APPS.map(a => `<button data-app="${a.id}" class="${a.id===current?'cur':''}" style="--c:${a.color}"><span class="ico" style="--c:${a.color}">${ICONS[a.icon]}</span>${a.name}</button>`).join('')
    + '<hr><button data-act="wake"><span class="mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></span>Layar tetap menyala: ' + (wlWanted ? 'Aktif' : 'Mati') + '</button><button data-act="reload"><span class="mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></span>Muat ulang</button>'
    + `<a href="${a0.url}" target="_blank" rel="noopener"><span class="mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></span>Buka di tab baru</a>`;
}
$('fabPanel').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  closePanel();
  if(b.dataset.app) openApp(b.dataset.app);
  else if(b.dataset.act === 'home') goHome();
  else if(b.dataset.act === 'reload') $('reload').click();
  else if(b.dataset.act === 'wake'){ wlWanted = !wlWanted; wlWanted ? lockOn() : lockOff(); buildPanel(); }
});
// Tombol bisa digeser agar tidak menutupi bagian aplikasi
(function(){
  const fab = $('fab'), btn = $('fabBtn');
  let drag = null, moved = false;
  btn.addEventListener('pointerdown', e => {
    const r = fab.getBoundingClientRect();
    drag = {dx:e.clientX - r.left, dy:e.clientY - r.top, x:e.clientX, y:e.clientY}; moved = false;
    btn.setPointerCapture(e.pointerId);
  });
  btn.addEventListener('pointermove', e => {
    if(!drag) return;
    if(!moved && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 6) return;
    moved = true; closePanel();
    const x = Math.min(Math.max(0, e.clientX - drag.dx), innerWidth - 46);
    const y = Math.min(Math.max(0, e.clientY - drag.dy), innerHeight - 46);
    fab.style.left = x + 'px'; fab.style.top = y + 'px'; fab.style.right = 'auto'; fab.style.bottom = 'auto';
  });
  btn.addEventListener('pointerup', () => { drag = null; });
  btn.addEventListener('click', () => {
    if(moved){ moved = false; return; }
    const open = $('fabPanel').hidden;
    if(open){
      const r = fab.getBoundingClientRect();
      fab.classList.toggle('left', r.left < innerWidth/2);
      const pv = $('fabPanel');
      pv.style.bottom = r.top > innerHeight/2 ? '56px' : 'auto';
      pv.style.top = r.top > innerHeight/2 ? 'auto' : '56px';
    }
    $('fabPanel').hidden = !open; btn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closePanel(); });
})();

$('brandBtn').onclick = () => goHome();
$('reload').onclick = () => {
  const fr = frames[current]; if(!fr) return;
  fr.loader.classList.remove('done'); fr.f.src = fr.f.src;
};
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1); id ? openApp(id,true) : goHome(true);
});
if(location.hash) openApp(location.hash.slice(1), true);
</script>
</body>
</html>
